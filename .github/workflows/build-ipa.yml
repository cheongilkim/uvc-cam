name: Build iPadOS UVCCam IPA

on:
  push:
    branches:
      - main
    paths:
      - 'ios_native/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-platform-version

      - name: Generate App Icon PNGs
        run: |
          cat << 'EOF' > /tmp/gen_icon.swift
          import AppKit
          import Foundation

          let outDir = URL(fileURLWithPath: CommandLine.arguments[1])
          let specs: [(String, Int)] = [
              ("AppIcon60x60@2x.png", 120),
              ("AppIcon60x60@3x.png", 180),
              ("AppIcon76x76@2x~ipad.png", 152),
              ("AppIcon83.5x83.5@2x~ipad.png", 167),
              ("AppIcon1024x1024.png", 1024),
          ]

          func drawIcon(size: Int) -> Data? {
              let s = CGFloat(size)
              guard let rep = NSBitmapImageRep(
                  bitmapDataPlanes: nil,
                  pixelsWide: size,
                  pixelsHigh: size,
                  bitsPerSample: 8,
                  samplesPerPixel: 4,
                  hasAlpha: true,
                  isPlanar: false,
                  colorSpaceName: .deviceRGB,
                  bytesPerRow: 0,
                  bitsPerPixel: 0
              ) else { return nil }

              NSGraphicsContext.saveGraphicsState()
              NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)

              let rect = NSRect(x: 0, y: 0, width: s, height: s)
              NSColor(red: 0.05, green: 0.06, blue: 0.09, alpha: 1.0).setFill()
              rect.fill()

              let ringRect = NSRect(x: s * 0.22, y: s * 0.22, width: s * 0.56, height: s * 0.56)
              let ring = NSBezierPath(ovalIn: ringRect)
              ring.lineWidth = s * 0.045
              NSColor(red: 0.20, green: 0.84, blue: 0.29, alpha: 1.0).setStroke()
              ring.stroke()

              let innerRect = NSRect(x: s * 0.34, y: s * 0.34, width: s * 0.32, height: s * 0.32)
              let inner = NSBezierPath(ovalIn: innerRect)
              NSColor(red: 0.04, green: 0.52, blue: 1.0, alpha: 0.9).setFill()
              inner.fill()

              let dotRect = NSRect(x: s * 0.72, y: s * 0.72, width: s * 0.08, height: s * 0.08)
              let dot = NSBezierPath(ovalIn: dotRect)
              NSColor(red: 0.20, green: 0.84, blue: 0.29, alpha: 1.0).setFill()
              dot.fill()

              NSGraphicsContext.restoreGraphicsState()
              return rep.representation(using: .png, properties: [:])
          }

          for (name, px) in specs {
              if let data = drawIcon(size: px) {
                  try data.write(to: outDir.appendingPathComponent(name))
              }
          }
          EOF
          mkdir -p build/Payload/UVCCam.app
          swift /tmp/gen_icon.swift build/Payload/UVCCam.app

      - name: Compile SwiftUI iPadOS Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc \
            -O \
            -target arm64-apple-ios17.0 \
            -swift-version 5 \
            -parse-as-library \
            -sdk "$SDK_PATH" \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework AVKit \
            -framework UIKit \
            -framework CoreMedia \
            ios_native/Sources/UVCCamApp.swift \
            -o build/Payload/UVCCam.app/UVCCam

          cp ios_native/Info.plist build/Payload/UVCCam.app/Info.plist
          SDK_NAME=$(xcrun --sdk iphoneos --show-sdk-version)
          /usr/libexec/PlistBuddy -c "Add :DTSDKName string iphoneos${SDK_NAME}" build/Payload/UVCCam.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :DTPlatformName string iphoneos" build/Payload/UVCCam.app/Info.plist || true
          plutil -convert binary1 build/Payload/UVCCam.app/Info.plist
          printf "APPL????" > build/Payload/UVCCam.app/PkgInfo
          codesign --force --sign - build/Payload/UVCCam.app

      - name: Package IPA
        run: |
          cd build
          zip -qry ../UVCCam.ipa Payload
          ls -lh ../UVCCam.ipa
          unzip -l ../UVCCam.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UVCCam-ipa
          path: UVCCam.ipa

      - name: Publish Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes 2>/dev/null || true
          gh release create v1.0.0 UVCCam.ipa \
            --title "UVC Cam iPadOS Native v1.0.0" \
            --notes "iPadOS 17+ native UVC external camera viewer built for USB sideloading via Sideloadly."
