name: Build Android UVCCam APK

on:
  push:
    branches:
      - main
    paths:
      - 'android_native/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android_native
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK Artifact
        run: |
          cp android_native/app/build/outputs/apk/debug/app-debug.apk UVCCam_Android.apk
          ls -lh UVCCam_Android.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UVCCam-Android-apk
          path: UVCCam_Android.apk

      - name: Upload APK to Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 UVCCam_Android.apk --clobber
          else
            gh release create v1.0.0 UVCCam_Android.apk \
              --title "UVC Cam v1.0.0" \
              --notes "iPadOS IPA and Android APK for external USB UVC cameras."
          fi
